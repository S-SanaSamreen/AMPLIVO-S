name: AMPLIVO CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: amplivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Dependencies
        working-directory: ./Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          
      - name: Run Pytest
        working-directory: ./Backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/amplivo_test
          DB_SSL_MODE: disable
        run: |
          pytest --cov=app --cov-report=xml
          
  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Run Vitest
        working-directory: ./frontend
        run: npx vitest run --coverage

  security-audit:
    name: Security Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pip-audit
        working-directory: ./Backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "Audit findings present"
      - name: Run npm audit
        working-directory: ./frontend
        run: npm audit || echo "Audit findings present"
